services:
  db:
    image: postgres:16-alpine
    container_name: formulario_club_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: formulario_club
      POSTGRES_USER: club_app
      POSTGRES_PASSWORD: club_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club_app -d formulario_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
